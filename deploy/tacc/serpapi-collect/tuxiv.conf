entrypoint:
  - /usr/bin/python3 ${TACC_WORKDIR}/main.py
environment:
  name: mpi-gemm-v1
  channels:
    - nodefaults
  dependencies:
    - "{}"
job:
  name: serpapi-shopping
  general:
    - partition=tacc
    - nodes=1
    - ntasks=1
    - cpus-per-task=2
    - time=00:20:00
    - job-name=serpapi-selftest
    - output=${TACC_SLURM_USERLOG}/serpapi-shopping-%j.log
