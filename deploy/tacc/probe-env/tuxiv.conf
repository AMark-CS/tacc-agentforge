entrypoint:
  - bash ${TACC_WORKDIR}/job.sh
environment:
  name: mpi-gemm-v1
  channels:
    - nodefaults
  dependencies:
    - "{}"
job:
  name: probe-env-inventory
  general:
    - partition=tacc
    - job-name=probe-env-inventory
    - nodes=1
    - ntasks=1
    - cpus-per-task=1
    - time=00:05:00
    - output=${TACC_SLURM_USERLOG}/agentforge-probe-env-%j.log
