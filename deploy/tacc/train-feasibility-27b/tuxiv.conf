entrypoint:
  - /usr/bin/python3 ${TACC_WORKDIR}/main_entry.py
environment:
  name: mpi-gemm-v1
  channels:
    - nodefaults
  dependencies:
    - "{}"
job:
  name: train-feasibility-27b
  general:
    - partition=tacc
    - nodes=1
    - ntasks=1
    - cpus-per-task=8
    - gres=gpu:2
    - time=00:45:00
    - job-name=train-feasibility-27b
    - output=${TACC_SLURM_USERLOG}/train-feasibility-27b-%j.log
