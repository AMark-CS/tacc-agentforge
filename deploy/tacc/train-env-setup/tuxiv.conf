entrypoint:
  - bash ${TACC_WORKDIR}/job.sh
environment:
  name: mpi-gemm-v1
  channels:
    - nodefaults
  dependencies:
    - "{}"
job:
  name: setup-train-libs
  general:
    - partition=tacc
    - job-name=setup-train-libs
    - nodes=1
    - ntasks=1
    - cpus-per-task=1
    - time=00:15:00
    - output=${TACC_SLURM_USERLOG}/agentforge-probe-env-%j.log
